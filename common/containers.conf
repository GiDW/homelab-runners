# Nested podman inside the runner container. Adapted from quay.io/podman/stable
# (github.com/containers/image_build, podman/containers.conf and
# podman-containers.conf).
#
# Inner containers share the runner container's namespaces and network, so
# they are subject to the same egress filtering and resource limits, and need
# no cgroup delegation, /dev/net/tun or fresh /proc mount.

[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"
# Mounting a new procfs fails under the outer container's masked /proc
# paths; bind-mount the existing one instead.
volumes = [
  "/proc:/proc",
]
# The default ping_group_range sysctl cannot be set with netns = "host".
default_sysctls = []

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
