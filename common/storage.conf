# Rootless storage for `runner` inside the runner container. The graph root
# stays at the default ~/.local/share/containers/storage, which is a volume.
# fuse-overlayfs works everywhere /dev/fuse is available; native overlay may
# also work on recent kernels (see README, "verify on host").

[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
